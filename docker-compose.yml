version: '3.8'

services:
  coordinator:
    build:
      context: .
      dockerfile: Dockerfile.coordinator
    ports:
      - "9700:9700"
    environment:
      - DOCKER_ENV=1
    volumes:
      - ./coordinator:/app/coordinator
      - ./common:/app/common
    networks:
      - lattice_net

  node1:
    build:
      context: .
      dockerfile: Dockerfile.node
    volumes:
      - ./node:/app/node
      - ./common:/app/common
      - ./data/node1:/app/data
    networks:
      - lattice_net

  node2:
    build:
      context: .
      dockerfile: Dockerfile.node
    volumes:
